name: Compiler l'app Android

# Se déclenche automatiquement à chaque envoi sur la branche principale,
# et peut aussi être relancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java (nécessaire pour Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Synchroniser le projet Android (Capacitor)
        run: npx cap sync android

      - name: Compiler l'APK (version de test, installable directement)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rendre l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: je-livre-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
