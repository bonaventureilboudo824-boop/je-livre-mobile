name: Compiler la version signée (Play Store)

# Se déclenche UNIQUEMENT à la demande : onglet "Actions" -> "Compiler la version signée
# (Play Store)" -> "Run workflow". Produit le fichier .aab à déposer sur la Play Console.
# Secrets à créer dans Settings -> Secrets and variables -> Actions (4 au total) :
#   JELIVRE_KEYSTORE_BASE64, JELIVRE_KEYSTORE_PASSWORD, JELIVRE_KEY_ALIAS, JELIVRE_KEY_PASSWORD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Contrôles avant compilation (paquet, niveau d'Android, secrets)
        env:
          KS_B64: ${{ secrets.JELIVRE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.JELIVRE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.JELIVRE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JELIVRE_KEY_PASSWORD }}
        run: |
          ok=1
          for n in KS_B64 KS_PASS KS_ALIAS KEY_PASS; do
            if [ -z "${!n}" ]; then echo "ERREUR : un des 4 secrets est vide ou absent ($n). Voir Settings > Secrets and variables > Actions."; ok=0; fi
          done
          T=$(grep -E "targetSdkVersion" android/variables.gradle | grep -oE "[0-9]+" | head -1)
          echo "targetSdkVersion = ${T:-introuvable}"
          if [ -z "$T" ] || [ "$T" -lt 36 ]; then echo "ERREUR : targetSdkVersion doit etre 36 ou plus pour une nouvelle application Google Play."; ok=0; fi
          APPID=$(grep -E "applicationId" android/app/build.gradle | head -1 | grep -oE "[A-Za-z0-9_.]+\.[A-Za-z0-9_.]+" | head -1)
          echo "applicationId = ${APPID:-introuvable}"
          if [ "$APPID" != "com.jelivre.app" ]; then echo "ERREUR : l'identifiant du paquet doit etre com.jelivre.app."; ok=0; fi
          GS=android/app/google-services.json
          if [ -f "$GS" ]; then
            if grep -q '"package_name": "com.jelivre.app"' "$GS"; then echo "google-services.json : paquet correct"; else echo "ERREUR : google-services.json ne contient pas le paquet com.jelivre.app."; ok=0; fi
          else echo "AVERTISSEMENT : android/app/google-services.json est absent (les notifications ne marcheront pas)."; fi
          grep -nE "versionCode|versionName" android/app/build.gradle | head -4 || true
          if [ "$ok" != "1" ]; then echo "=> Arret : corrigez les erreurs ci-dessus, puis relancez."; exit 1; fi
          echo "=> Contrôles réussis."

      - name: Installer Java (nécessaire pour Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer le SDK Android
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install

      - name: Synchroniser le projet Android (Capacitor)
        run: npx cap sync android

      - name: Reconstituer la clé de signature depuis le secret
        run: echo "${{ secrets.JELIVRE_KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/jelivre-release.jks

      - name: Compiler le fichier .aab signé (celui à déposer sur le Play Store)
        working-directory: android
        env:
          JELIVRE_KEYSTORE_PATH: ${{ runner.temp }}/jelivre-release.jks
          JELIVRE_KEYSTORE_PASSWORD: ${{ secrets.JELIVRE_KEYSTORE_PASSWORD }}
          JELIVRE_KEY_ALIAS: ${{ secrets.JELIVRE_KEY_ALIAS }}
          JELIVRE_KEY_PASSWORD: ${{ secrets.JELIVRE_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease

      - name: Vérifier la signature du .aab (affiche seulement l'empreinte publique)
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256|Valid from" | head -4

      - name: Rendre le .aab téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: je-livre-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
